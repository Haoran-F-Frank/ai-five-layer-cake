<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <title>AI 五层蛋糕：能源、芯片、基础设施、模型、应用</title>
  <defs>
    <linearGradient id="shine" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 盘子 -->
  <ellipse cx="260" cy="440" rx="235" ry="22" fill="#9ca3af" opacity="0.35"/>
  <!-- 第1层 能源（最底层，最宽） -->
  <g>
    <path d="M40 360 v58 a220 26 0 0 0 440 0 v-58 z" fill="#9a3412"/>
    <ellipse cx="260" cy="360" rx="220" ry="26" fill="#c2410c"/>
    <path d="M40 360 v58 a220 26 0 0 0 440 0 v-58 a220 26 0 0 1 -440 0z" fill="url(#shine)"/>
    <text x="260" y="404" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">① 能源 Energy</text>
  </g>
  <!-- 第2层 芯片 -->
  <g>
    <path d="M70 282 v62 a190 23 0 0 0 380 0 v-62 z" fill="#5b21b6"/>
    <ellipse cx="260" cy="282" rx="190" ry="23" fill="#7c3aed"/>
    <text x="260" y="330" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">② 芯片 Chips</text>
  </g>
  <!-- 第3层 基础设施 -->
  <g>
    <path d="M100 206 v62 a160 20 0 0 0 320 0 v-62 z" fill="#115e59"/>
    <ellipse cx="260" cy="206" rx="160" ry="20" fill="#0f766e"/>
    <text x="260" y="254" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">③ 基础设施 Infrastructure</text>
  </g>
  <!-- 第4层 模型 -->
  <g>
    <path d="M130 132 v60 a130 17 0 0 0 260 0 v-60 z" fill="#1e3a8a"/>
    <ellipse cx="260" cy="132" rx="130" ry="17" fill="#1d4ed8"/>
    <text x="260" y="178" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">④ 模型 Models</text>
  </g>
  <!-- 第5层 应用（最顶层） -->
  <g>
    <path d="M160 62 v56 a100 14 0 0 0 200 0 v-56 z" fill="#9d174d"/>
    <ellipse cx="260" cy="62" rx="100" ry="14" fill="#db2777"/>
    <text x="260" y="104" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">⑤ 应用 Applications</text>
  </g>
  <!-- 顶部的“蜡烛”：用户价值 -->
  <rect x="254" y="22" width="12" height="34" rx="3" fill="#fbbf24"/>
  <path d="M260 4 c8 10 6 16 0 18 c-6 -2 -8 -8 0 -18z" fill="#f97316"/>
  <!-- 左侧箭头：依赖方向 -->
  <g stroke="#6b7280" stroke-width="2" fill="none">
    <path d="M18 420 V70"/>
    <path d="M10 82 L18 66 L26 82"/>
  </g>
  <text x="10" y="250" fill="#6b7280" font-size="13" transform="rotate(-90 10 250)" text-anchor="middle">下层支撑上层 · 价值向上流动</text>
</svg>
